<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bypass failed</title>
<style>
:root{color-scheme:light dark}
body{margin:0 auto;max-width:42rem;padding:1rem;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.err{color:#c00}
.hint{color:#888;font-size:.9rem;overflow-wrap:anywhere}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;padding:.35rem .5rem;border-bottom:1px solid #8884}
@media (prefers-color-scheme:dark){body{background:#111;color:#eee}a{color:#9cf}}
</style>
</head>
<body>
<main>
<h1>Bypass failed</h1>
<p class="err">{{.Error}}</p>
<p class="hint">{{.Target}}</p>
<table>
  <thead><tr><th>Strategy</th><th>Status</th></tr></thead>
  <tbody>{{range .Attempts}}<tr><td>{{.Strategy}}</td><td>{{.Status}}</td></tr>{{end}}</tbody>
</table>
<p>Retry with: {{range $i, $t := .Tries}}{{if $i}} · {{end}}<a href="{{$t.URL}}">{{$t.Name}}</a>{{end}}</p>
</main>
</body>
</html>
