<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{.Title}}</title>
<style>
:root{color-scheme:light dark}
body{margin:0 auto;max-width:42rem;padding:0 1rem 4rem;font:1.125rem/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
img,video,iframe{max-width:100%;height:auto}
h1{font-size:1.6rem;line-height:1.25}
.byline,.site{color:#888;font-size:.95rem;margin:.2rem 0}
a{overflow-wrap:anywhere}
@media (prefers-color-scheme:dark){body{background:#111;color:#eee}a{color:#9cf}}
</style>
</head>
<body>
{{.Banner}}
<main>
<article>
<h1>{{.Title}}</h1>
{{if .Byline}}<p class="byline">{{.Byline}}</p>{{end}}
{{if .SiteName}}<p class="site">{{.SiteName}}</p>{{end}}
{{.Content}}
</article>
</main>
</body>
</html>
